<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menú completo</title>
<script src="/carrito.js"></script>
<style>
  /* Misma paleta de variables que index.html — el tema del tenant las sobreescribe en vivo */
  :root{
    --bg:#0a0a0e;
    --cyan:#22d3f5;
    --pink:#ff2d87;
    --white:#f5f5f7;
    --gray:#9a9aa5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--white); font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  body{ max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:90px; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  img{ display:block; max-width:100%; }

  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    background:rgba(8,8,11,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%;
    border:1.5px solid var(--pink);
    display:flex; align-items:center; justify-content:center;
    color:var(--white); flex-shrink:0;
    box-shadow:0 0 10px rgba(255,45,135,.25);
  }
  .back-btn svg{ width:17px; height:17px; }
  header img.tenant-logo{ height:34px; width:auto; max-width:150px; object-fit:contain; margin:0 auto; }
  .header-spacer{ width:36px; flex-shrink:0; }

  .cat-tabs{
    display:flex; gap:8px; overflow-x:auto;
    padding:14px 16px; scrollbar-width:none;
  }
  .cat-tabs::-webkit-scrollbar{ display:none; }
  .cat-tab{
    flex-shrink:0;
    padding:8px 16px;
    border-radius:20px;
    border:1.5px solid rgba(255,255,255,.15);
    font-size:12px; font-weight:700; letter-spacing:.3px;
    color:var(--gray);
    white-space:nowrap;
  }
  .cat-tab.active{
    border-color:var(--cyan); color:var(--cyan);
    box-shadow:0 0 10px rgba(34,211,245,.3);
  }

  .cat-section{ padding:6px 16px 4px; }
  .cat-title{
    font-family:'Arial Black', Impact, sans-serif;
    font-size:15px; letter-spacing:.5px;
    margin:18px 0 12px;
    color:var(--white);
  }

  .prod-row{
    display:flex; gap:12px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:10px;
    margin-bottom:10px;
    align-items:center;
  }
  .prod-thumb{
    width:64px; height:64px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg, rgba(34,211,245,.25), rgba(255,45,135,.25));
    background-size:cover; background-position:center;
  }
  .prod-info{ flex:1; min-width:0; }
  .prod-name{ font-size:13px; font-weight:800; letter-spacing:.2px; }
  .prod-desc{ font-size:11px; color:var(--gray); margin-top:2px; line-height:1.35; }
  .prod-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .prod-price{ font-size:13px; font-weight:800; }
  .add-btn{
    width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--cyan); color:var(--cyan);
    background:transparent; font-size:15px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 8px rgba(34,211,245,.3);
  }

  .empty-msg{ padding:60px 20px; text-align:center; color:var(--gray); font-size:13px; }

  /* Barra flotante "Ver carrito" */
  .carrito-flotante{
    position:fixed; left:16px; right:16px; bottom:16px;
    max-width:488px; margin:0 auto;
    background:linear-gradient(90deg,var(--cyan),var(--pink));
    color:#04040a; border-radius:16px; padding:13px 16px;
    display:flex; align-items:center; justify-content:space-between;
    font-weight:800; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:30;
  }
  .carrito-flotante-count{
    background:#04040a; color:#fff; border-radius:50%;
    width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
    font-size:10.5px; margin-right:8px;
  }

  @media (min-width:640px){
    body{ max-width:820px; }
    .prod-thumb{ width:76px; height:76px; }
    .carrito-flotante{ max-width:788px; }
  }
  /* POS sin autopedido: sin botones "+" ni carrito, solo ver la carta */
  body.pos-sin-autopedido .add-btn,
  body.pos-sin-autopedido .carrito-flotante{ display:none !important; }
</style>
</head>
<body>

  <header>
    <a class="back-btn" id="backBtn" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <img class="tenant-logo" src="" alt="Logo del negocio">
    <div class="header-spacer" aria-hidden="true"></div>
  </header>

  <nav class="cat-tabs" id="catTabs"></nav>

  <main id="catalogo">
    <div class="empty-msg">Cargando menú…</div>
  </main>

  <script>
    function getTenantSlug() {
      const partes = location.pathname.split('/').filter(Boolean);
      // /<slug>/menu
      if (partes[0]) return decodeURIComponent(partes[0]);
      return 'cero-absoluto';
    }
    const SLUG = getTenantSlug();
    document.getElementById('backBtn').href = `/${SLUG}`;

    let TENANT_DATA = null;

    function agruparPorCategoria(productos) {
      const mapa = new Map();
      productos.forEach(p => {
        if (!mapa.has(p.categoria)) mapa.set(p.categoria, []);
        mapa.get(p.categoria).push(p);
      });
      return mapa;
    }

    function pintarCarritoFlotante() {
      const n = Carrito.totalItems(SLUG);
      let bar = document.getElementById('carritoFlotante');
      if (n === 0) { if (bar) bar.remove(); return; }
      const moneda = TENANT_DATA?.moneda || 'COP';
      const total = Carrito.totalPrecio(SLUG);
      if (!bar) {
        bar = document.createElement('a');
        bar.id = 'carritoFlotante';
        bar.className = 'carrito-flotante';
        bar.href = `/${SLUG}/checkout`;
        document.body.appendChild(bar);
      }
      bar.innerHTML = `<span><span class="carrito-flotante-count">${n}</span>Ver carrito</span><span>${formatearPrecio(total, moneda)}</span>`;
    }

    function pintarCatalogo(data) {
      TENANT_DATA = data;
      // POS sin autopedido: solo se ve la carta, no se puede pedir desde el celular.
      try{ document.body.classList.toggle('pos-sin-autopedido', data.modo==='pos' && (data.pos_autopedido===0 || data.pos_autopedido==='0')); }catch(e){}
      document.title = `Menú — ${data.nombre}`;
      document.querySelectorAll('.tenant-logo').forEach(img => {
        if (data.logo_url) { img.src = data.logo_url; img.style.display = ''; }
        else { img.style.display = 'none'; }
      });

      const root = document.documentElement.style;
      if (data.tema.fondo) root.setProperty('--bg', data.tema.fondo);
      if (data.tema.acento2) root.setProperty('--cyan', data.tema.acento2);
      if (data.tema.acento1) root.setProperty('--pink', data.tema.acento1);

      const productos = data.productos || [];
      const catalogo = document.getElementById('catalogo');
      const catTabs = document.getElementById('catTabs');

      if (productos.length === 0) {
        catalogo.innerHTML = '<div class="empty-msg">Este negocio todavía no cargó productos.</div>';
        return;
      }

      const moneda = data.moneda || 'COP';
      const porCategoria = agruparPorCategoria(productos);
      catalogo.innerHTML = '';
      catTabs.innerHTML = '';

      let primero = true;
      porCategoria.forEach((items, categoria) => {
        const tabId = 'cat-' + categoria.toLowerCase().replace(/[^a-z0-9]+/g, '-');

        const tab = document.createElement('a');
        tab.href = '#' + tabId;
        tab.className = 'cat-tab' + (primero ? ' active' : '');
        tab.textContent = categoria;
        catTabs.appendChild(tab);

        const section = document.createElement('section');
        section.className = 'cat-section';
        section.id = tabId;
        section.innerHTML = `<h2 class="cat-title">${categoria}</h2>`;

        items.forEach(p => {
          const row = document.createElement('div');
          row.className = 'prod-row';
          const imgStyle = p.imagen_url ? `style="background-image:url('${p.imagen_url}')"` : '';
          row.innerHTML = `
            <div class="prod-thumb" ${imgStyle}></div>
            <div class="prod-info">
              <div class="prod-name">${p.nombre}</div>
              ${p.descripcion ? `<div class="prod-desc">${p.descripcion}</div>` : ''}
              <div class="prod-foot">
                <span class="prod-price">${formatearPrecio(p.precio, moneda)}</span>
                <button class="add-btn" data-id="${p.id}" data-nombre="${p.nombre}" data-precio="${p.precio}">+</button>
              </div>
            </div>`;
          section.appendChild(row);
        });

        catalogo.appendChild(section);
        primero = false;
      });

      catalogo.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          Carrito.agregar(SLUG, {
            producto_id: btn.dataset.id, nombre: btn.dataset.nombre, precio: Number(btn.dataset.precio)
          });
          pintarCarritoFlotante();
          btn.style.background = 'rgba(34,211,245,.35)';
          setTimeout(() => btn.style.background = 'transparent', 200);
        });
      });

      pintarCarritoFlotante();
    }

    fetch(`/menu/${SLUG}`)
      .then(r => r.ok ? r.json() : Promise.reject(new Error('Negocio no encontrado')))
      .then(pintarCatalogo)
      .catch(err => {
        document.getElementById('catalogo').innerHTML = '<div class="empty-msg">No se pudo cargar el menú.</div>';
        console.warn(err);
      });
  </script>
</body>
</html>
