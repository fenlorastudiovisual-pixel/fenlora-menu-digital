<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chat del negocio</title>
<style>
:root{
  --bg:#0B0F1A;--card:#131A2A;--card2:#1B2438;--line:rgba(255,255,255,.09);
  --txt:#F0F4FF;--txt2:#AEB8CC;--txt3:#7E8AA0;--acc:#5B8CFF;--ok:#57D9A3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#0B0F1A,#0E1424);color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;height:100dvh}
.head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  background:rgba(11,15,26,.7);backdrop-filter:blur(8px)}
.head .av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#0B1120;display:flex;
  align-items:center;justify-content:center;font-weight:800;flex:none}
.head b{font-size:15px}
.head small{color:var(--ok);font-size:12px;display:block}
.head .nuevo{margin-left:auto;background:none;border:1px solid var(--line);color:var(--txt3);
  border-radius:9px;padding:6px 11px;font-size:12px;cursor:pointer}
.head .nuevo:hover{color:var(--txt);border-color:var(--acc)}
.wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px}
.msg{display:flex}.msg.c{justify-content:flex-end}
.bub{max-width:82%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.msg.c .bub{background:#134D3B;border-bottom-right-radius:4px}
.msg.b .bub{background:var(--card2);border-bottom-left-radius:4px}
.typing .bub{color:var(--txt3)}
.cart{border-top:1px solid var(--line);background:var(--card);padding:10px 16px;max-height:34vh;overflow:auto}
.cart h4{margin:0 0 6px;font-size:11px;color:var(--txt3);letter-spacing:.5px;text-transform:uppercase}
.cl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0}
.cl small{color:var(--txt3);display:block;font-size:12px}
.ctot{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);
  font-weight:800;font-size:15px}
.done{background:rgba(87,217,163,.12);border:1px solid rgba(87,217,163,.35);color:var(--ok);
  border-radius:10px;padding:8px 12px;margin-top:8px;font-size:13.5px;font-weight:600}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:rgba(11,15,26,.9)}
.bar input{flex:1;background:#0A1120;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  color:var(--txt);font-size:15px;outline:none}
.bar input:focus{border-color:var(--acc)}
.bar button{background:var(--acc);color:#0B1120;border:0;border-radius:12px;padding:0 18px;font-weight:800;font-size:15px;cursor:pointer}
.bar button:disabled{opacity:.5}
.err{color:#FF9b9b;font-size:12px;padding:4px 16px}
.demo{font-size:11px;color:var(--txt3);text-align:center;padding:6px}
</style>
</head>
<body>
  <div class="head">
    <div class="av" id="ini">·</div>
    <div><b id="neg">Cargando…</b><small>en línea · responde al instante</small></div>
    <button class="nuevo" id="nuevo" onclick="nuevoPedido()">Nuevo pedido</button>
  </div>
  <div class="wrap" id="wrap"></div>
  <div class="cart" id="cart" hidden></div>
  <div class="err" id="err" hidden></div>
  <div class="demo">Cerebro con IA · lee el menú real · los precios los pone el servidor</div>
  <div class="bar">
    <input id="inp" placeholder="Escribe tu pedido…" autocomplete="off">
    <button id="btn">Enviar</button>
  </div>

<script>
const parts = location.pathname.split("/").filter(Boolean);
const SLUG = parts[0] || "";
const LSKEY = "fenbot_" + SLUG;      // memoria por negocio, en el teléfono del cliente
const wrap = document.getElementById("wrap");
const cartEl = document.getElementById("cart");
const inp = document.getElementById("inp");
const btn = document.getElementById("btn");
const errEl = document.getElementById("err");

let negName = SLUG;
let historial = [];      // {rol:'cliente'|'bot', texto} — se manda a la IA
let transcript = [];     // {who:'c'|'b', text} — lo que se ve en pantalla
let lastCart = null;     // {carrito, totalTxt, pedido}
let cargando = false;
let cerrado = false;

// ---- Guardar / recuperar del teléfono (sobrevive a recargas) ----
function guardar(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({ transcript, historial, lastCart, cerrado })); }catch(e){}
}
function recuperar(){
  try{
    const raw = localStorage.getItem(LSKEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    transcript = Array.isArray(d.transcript) ? d.transcript : [];
    historial  = Array.isArray(d.historial) ? d.historial : [];
    lastCart   = d.lastCart || null;
    cerrado    = !!d.cerrado;
    return transcript.length > 0;
  }catch(e){ return false; }
}

function pintarMsg(who, txt, typing){
  const d = document.createElement("div");
  d.className = "msg " + (who==="c"?"c":"b") + (typing?" typing":"");
  d.innerHTML = '<div class="bub"></div>';
  d.querySelector(".bub").textContent = txt;
  wrap.appendChild(d);
  wrap.scrollTop = wrap.scrollHeight;
  return d;
}
// añade al transcript visible + lo guarda
function bub(who, txt){
  transcript.push({ who, text: txt });
  guardar();
  return pintarMsg(who, txt, false);
}

function pintarCarrito(carrito, totalTxt, pedido){
  if(!carrito || !carrito.length){ cartEl.hidden = true; cartEl.innerHTML=""; return; }
  cartEl.hidden = false;
  let h = "<h4>🛒 Tu pedido</h4>";
  carrito.forEach(i=>{
    const nota = i.nota ? '<small>'+i.nota+'</small>' : '';
    h += '<div class="cl"><div>'+i.cantidad+'× '+i.nombre+nota+'</div><div>$'+(i.subtotal).toLocaleString('es-CO')+'</div></div>';
  });
  h += '<div class="ctot"><span>Total</span><span>'+totalTxt+'</span></div>';
  if(pedido){ h += '<div class="done">✅ Pedido #'+(pedido.numero||pedido.id)+' enviado a la cocina</div>'; }
  cartEl.innerHTML = h;
}

function nuevoPedido(){
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  transcript = []; historial = []; lastCart = null; cerrado = false;
  wrap.innerHTML = ""; cartEl.hidden = true; cartEl.innerHTML = "";
  inp.placeholder = "Escribe tu pedido…";
  saludar();
}

function saludar(){
  bub("b", "¡Hola! 👋 Bienvenido a "+negName+". Escríbeme lo que se te antoje y te ayudo con tu pedido.");
}

async function enviar(){
  const msg = inp.value.trim();
  if(!msg || cargando) return;
  errEl.hidden = true;
  inp.value = "";
  bub("c", msg);
  historial.push({rol:"cliente", texto:msg}); guardar();
  cargando = true; btn.disabled = true;
  const t = pintarMsg("b", "escribiendo…", true);

  try{
    const r = await fetch("/menu/"+encodeURIComponent(SLUG)+"/bot", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ mensaje: msg, historial })
    });
    const data = await r.json();
    t.remove();
    if(!r.ok){
      const map = {no_pos:"Este negocio no está en modo POS.", ia_sin_config:"Falta activar la IA en el Worker.",
        sin_catalogo:"El negocio no tiene productos disponibles.", pos_error:"No pude leer el catálogo del POS."};
      bub("b", "⚠️ " + (map[data.error] || (data.detalle || data.error || "Error")));
      return;
    }
    bub("b", data.respuesta);
    historial.push({rol:"bot", texto:data.respuesta});
    lastCart = { carrito:data.carrito, totalTxt:data.total_texto, pedido:data.pedido };
    pintarCarrito(data.carrito, data.total_texto, data.pedido);
    if(data.confirmado){ cerrado = true; inp.placeholder = "Pedido confirmado ✅ — toca 'Nuevo pedido' para otro"; }
    guardar();
  }catch(e){
    t.remove();
    errEl.hidden = false; errEl.textContent = "Sin conexión con el servidor: "+e.message;
  }finally{
    cargando = false; btn.disabled = false; inp.focus();
  }
}

btn.onclick = enviar;
inp.addEventListener("keydown", e=>{ if(e.key==="Enter") enviar(); });

// ---- Arranque ----
function arrancar(){
  document.getElementById("neg").textContent = negName;
  document.getElementById("ini").textContent = (negName[0]||"·").toUpperCase();
  const habia = recuperar();
  if(habia){
    // Restaurar conversación tal cual quedó (sobrevivió a la recarga)
    transcript.forEach(m => pintarMsg(m.who, m.text, false));
    if(lastCart) pintarCarrito(lastCart.carrito, lastCart.totalTxt, lastCart.pedido);
    if(cerrado) inp.placeholder = "Pedido confirmado ✅ — toca 'Nuevo pedido' para otro";
  }else{
    saludar();
  }
}

// Cargar nombre del negocio y arrancar
fetch("/menu/"+encodeURIComponent(SLUG)).then(r=>r.json()).then(d=>{
  negName = d.nombre || SLUG; arrancar();
}).catch(()=>{ arrancar(); });
</script>
</body>
</html>
