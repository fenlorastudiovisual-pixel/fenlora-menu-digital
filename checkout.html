<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tu pedido</title>
<style>
  :root{ --bg:#0a0a0e; --cyan:#22d3f5; --pink:#ff2d87; --white:#f5f5f7; --gray:#9a9aa5; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--white); font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  body{ max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:120px; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    background:rgba(8,8,11,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%;
    border:1.5px solid var(--pink);
    display:flex; align-items:center; justify-content:center;
    color:var(--white); flex-shrink:0;
  }
  .back-btn svg{ width:17px; height:17px; }
  header h1{ font-size:15px; letter-spacing:.3px; }

  .lista{ padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .item{
    display:flex; align-items:center; gap:12px;
    border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:10px;
  }
  .item-info{ flex:1; min-width:0; }
  .item-nombre{ font-size:13px; font-weight:800; }
  .item-precio{ font-size:11.5px; color:var(--gray); margin-top:2px; }
  .qty{ display:flex; align-items:center; gap:8px; }
  .qty button{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--cyan); color:var(--cyan);
    background:transparent; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .qty span{ min-width:16px; text-align:center; font-size:13px; font-weight:700; }
  .item-sub{ font-size:13px; font-weight:800; min-width:64px; text-align:right; }

  .empty-msg{ padding:60px 20px; text-align:center; color:var(--gray); font-size:13px; }

  .nota{ padding:6px 16px 14px; }
  .nota label{ font-size:12px; color:var(--gray); display:block; margin-bottom:6px; }
  .nota input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04); color:var(--white); font-size:13px;
  }

  .resumen{
    position:fixed; left:0; right:0; bottom:0;
    max-width:520px; margin:0 auto;
    background:#111116; border-top:1px solid rgba(255,255,255,.1);
    padding:14px 16px max(14px, env(safe-area-inset-bottom));
  }
  .resumen-total{ display:flex; justify-content:space-between; font-size:14px; font-weight:800; margin-bottom:10px; }
  .btn-confirmar{
    width:100%; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(90deg,var(--cyan),var(--pink)); color:#04040a;
    font-weight:800; font-size:13.5px; letter-spacing:.5px;
  }
  .btn-confirmar:disabled{ opacity:.5; }

  .confirmacion{ padding:60px 24px; text-align:center; }
  .confirmacion h2{ font-size:20px; margin-bottom:10px; }
  .confirmacion p{ color:var(--gray); font-size:13.5px; line-height:1.5; margin-bottom:22px; }
  .confirmacion .cta{
    display:inline-flex; padding:12px 22px; border-radius:30px;
    background:linear-gradient(90deg,var(--cyan),var(--pink)); color:#04040a; font-weight:800; font-size:13px;
  }

  @media (min-width:640px){ body{ max-width:820px; } .resumen{ max-width:820px; } }
</style>
</head>
<body>

  <header>
    <a class="back-btn" id="backBtn" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Tu pedido</h1>
  </header>

  <div id="contenido">
    <div class="empty-msg">Cargando…</div>
  </div>

  <script src="/carrito.js"></script>
  <script>
    function getTenantSlug() {
      const partes = location.pathname.split('/').filter(Boolean);
      // /<slug>/checkout
      if (partes[0]) return decodeURIComponent(partes[0]);
      return 'cero-absoluto';
    }
    const SLUG = getTenantSlug();
    document.getElementById('backBtn').href = `/${SLUG}/menu`;

    let TENANT = null;

    function pintarCarrito() {
      const items = Carrito.obtener(SLUG);
      const contenido = document.getElementById('contenido');

      if (items.length === 0) {
        contenido.innerHTML = `<div class="empty-msg">Tu carrito está vacío.<br><br><a href="/${SLUG}/menu" style="color:var(--cyan)">Ver el menú →</a></div>`;
        return;
      }

      const moneda = TENANT?.moneda || 'COP';
      let html = '<div class="lista">';
      items.forEach(it => {
        html += `
          <div class="item">
            <div class="item-info">
              <div class="item-nombre">${it.nombre}</div>
              <div class="item-precio">${formatearPrecio(it.precio, moneda)} c/u</div>
            </div>
            <div class="qty">
              <button data-accion="restar" data-id="${it.producto_id}">−</button>
              <span>${it.cantidad}</span>
              <button data-accion="sumar" data-id="${it.producto_id}">+</button>
            </div>
            <div class="item-sub">${formatearPrecio(it.precio * it.cantidad, moneda)}</div>
          </div>`;
      });
      html += '</div>';
      html += `
        <div class="nota">
          <label for="notaInput">Nota para tu pedido (ej: número de mesa)</label>
          <input id="notaInput" type="text" placeholder="Ej: Mesa 4">
        </div>`;
      contenido.innerHTML = html;

      contenido.querySelectorAll('[data-accion]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const delta = btn.dataset.accion === 'sumar' ? 1 : -1;
          Carrito.cambiarCantidad(SLUG, id, delta);
          pintarCarrito();
          pintarResumen();
        });
      });
    }

    function pintarResumen() {
      const total = Carrito.totalPrecio(SLUG);
      const n = Carrito.totalItems(SLUG);
      const moneda = TENANT?.moneda || 'COP';
      let bar = document.getElementById('resumenBar');
      if (n === 0) { if (bar) bar.remove(); return; }
      if (!bar) {
        bar = document.createElement('div');
        bar.className = 'resumen';
        bar.id = 'resumenBar';
        document.body.appendChild(bar);
      }
      bar.innerHTML = `
        <div class="resumen-total"><span>Total (${n})</span><span>${formatearPrecio(total, moneda)}</span></div>
        <button class="btn-confirmar" id="btnConfirmar">${TENANT?.whatsapp ? 'ENVIAR PEDIDO POR WHATSAPP' : 'CONFIRMAR PEDIDO'}</button>`;
      document.getElementById('btnConfirmar').addEventListener('click', confirmarPedido);
    }

    function construirMensajeWhatsapp(items, total, nota, pedidoId, moneda) {
      let texto = `Hola *${TENANT.nombre}* 👋, quiero hacer este pedido (#${pedidoId}):\n\n`;
      items.forEach(it => {
        texto += `• ${it.cantidad}x ${it.nombre} — ${formatearPrecio(it.precio * it.cantidad, moneda)}\n`;
      });
      texto += `\n*Total: ${formatearPrecio(total, moneda)}*`;
      if (nota) texto += `\nNota: ${nota}`;
      return encodeURIComponent(texto);
    }

    async function confirmarPedido() {
      const items = Carrito.obtener(SLUG);
      if (items.length === 0) return;
      const btn = document.getElementById('btnConfirmar');
      btn.disabled = true;
      btn.textContent = 'ENVIANDO...';

      const nota = document.getElementById('notaInput')?.value || '';
      const total = Carrito.totalPrecio(SLUG);
      const moneda = TENANT?.moneda || 'COP';

      try {
        const r = await fetch(`/menu/${SLUG}/pedido`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items, total, cliente_nota: nota })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'No se pudo registrar el pedido');

        // Guardamos el pedido siempre (queda en tu admin y disponible para el día
        // que lo conectes a un POS real). Además, si el negocio tiene WhatsApp,
        // abrimos el chat con el detalle ya escrito.
        if (TENANT.whatsapp) {
          const mensaje = construirMensajeWhatsapp(items, total, nota, data.id, moneda);
          window.open(`https://wa.me/${TENANT.whatsapp}?text=${mensaje}`, '_blank');
        }

        Carrito.vaciar(SLUG);
        mostrarConfirmacion(data.id, total);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = TENANT?.whatsapp ? 'ENVIAR PEDIDO POR WHATSAPP' : 'CONFIRMAR PEDIDO';
        alert('No se pudo enviar el pedido. Intenta de nuevo.');
        console.warn(err);
      }
    }

    function mostrarConfirmacion(pedidoId, total) {
      document.getElementById('resumenBar')?.remove();
      const moneda = TENANT?.moneda || 'COP';
      const tienePago = !!TENANT?.pago_url;
      const tieneWhatsapp = !!TENANT?.whatsapp;

      document.getElementById('contenido').innerHTML = `
        <div class="confirmacion">
          <h2>¡Pedido #${pedidoId} registrado!</h2>
          <p>
            Total: <strong>${formatearPrecio(total, moneda)}</strong><br><br>
            ${tieneWhatsapp
              ? 'Te abrimos WhatsApp en una pestaña nueva con tu pedido ya escrito — solo dale enviar.'
              : (tienePago
                  ? 'Te abrimos la página de pago en una pestaña nueva. Cuando termines, muestra la confirmación en caja o a tu mesero.'
                  : 'Acércate a caja o avisa a tu mesero para completar el pago de tu pedido.')}
          </p>
          ${tienePago && !tieneWhatsapp ? `<a class="cta" href="${TENANT.pago_url}" target="_blank">IR A PAGAR</a>` : `<a class="cta" href="/${SLUG}">VOLVER AL INICIO</a>`}
        </div>`;

      if (tienePago && !tieneWhatsapp) {
        setTimeout(() => window.open(TENANT.pago_url, '_blank'), 400);
      }
    }

    fetch(`/menu/${SLUG}`)
      .then(r => r.ok ? r.json() : Promise.reject(new Error('Negocio no encontrado')))
      .then(data => {
        TENANT = data;
        document.title = `Tu pedido — ${data.nombre}`;
        const root = document.documentElement.style;
        if (data.tema.fondo) root.setProperty('--bg', data.tema.fondo);
        if (data.tema.acento2) root.setProperty('--cyan', data.tema.acento2);
        if (data.tema.acento1) root.setProperty('--pink', data.tema.acento1);
        pintarCarrito();
        pintarResumen();
      })
      .catch(err => {
        document.getElementById('contenido').innerHTML = '<div class="empty-msg">No se pudo cargar el negocio.</div>';
        console.warn(err);
      });
  </script>
</body>
</html>
