<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tu pedido</title>
<style>
  :root{ --bg:#0a0a0e; --cyan:#22d3f5; --pink:#ff2d87; --white:#f5f5f7; --gray:#9a9aa5; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--white); font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  body{ max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:120px; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    background:rgba(8,8,11,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%;
    border:1.5px solid var(--pink);
    display:flex; align-items:center; justify-content:center;
    color:var(--white); flex-shrink:0;
  }
  .back-btn svg{ width:17px; height:17px; }
  header h1{ font-size:15px; letter-spacing:.3px; }

  .lista{ padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .item{
    display:flex; align-items:center; gap:12px;
    border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:10px;
  }
  .item-info{ flex:1; min-width:0; }
  .item-nombre{ font-size:13px; font-weight:800; }
  .item-precio{ font-size:11.5px; color:var(--gray); margin-top:2px; }
  .qty{ display:flex; align-items:center; gap:8px; }
  .qty button{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--cyan); color:var(--cyan);
    background:transparent; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .qty span{ min-width:16px; text-align:center; font-size:13px; font-weight:700; }
  .item-sub{ font-size:13px; font-weight:800; min-width:64px; text-align:right; }

  .empty-msg{ padding:60px 20px; text-align:center; color:var(--gray); font-size:13px; }

  .nota{ padding:6px 16px 14px; }
  .nota label{ font-size:12px; color:var(--gray); display:block; margin-bottom:6px; }
  .nota input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04); color:var(--white); font-size:13px;
  }

  .resumen{
    position:fixed; left:0; right:0; bottom:0;
    max-width:520px; margin:0 auto;
    background:#111116; border-top:1px solid rgba(255,255,255,.1);
    padding:14px 16px max(14px, env(safe-area-inset-bottom));
  }
  .resumen-total{ display:flex; justify-content:space-between; font-size:14px; font-weight:800; margin-bottom:10px; }
  .btn-confirmar{
    width:100%; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(90deg,var(--cyan),var(--pink)); color:#04040a;
    font-weight:800; font-size:13.5px; letter-spacing:.5px;
  }
  .btn-confirmar:disabled{ opacity:.5; }

  /* Seguimiento del pedido */
  .ped-track{ display:flex; align-items:center; justify-content:center; gap:10px; margin:6px auto 8px; padding:12px 16px; max-width:340px;
    background:rgba(34,211,245,.10); border:1px solid rgba(34,211,245,.35); border-radius:14px; }
  .ped-track-dot{ width:12px; height:12px; border-radius:50%; background:#22d3f5; flex:none; animation:pt-pulse 1.1s infinite; }
  @keyframes pt-pulse{ 0%,100%{ transform:scale(.7); opacity:.5;} 50%{ transform:scale(1.15); opacity:1;} }
  .ped-track-txt{ font-size:13.5px; font-weight:700; color:#eaf7ff; }
  .ped-track-hint{ font-size:12px !important; color:var(--gray); max-width:320px; margin:0 auto 20px !important; }
  /* Alerta grande "pedido listo" (el beeper de KFC) */
  .listo-ov{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,.55); backdrop-filter:blur(3px); animation:lo-in .2s ease; }
  @keyframes lo-in{ from{opacity:0} to{opacity:1} }
  .listo-card{ width:min(420px,92vw); text-align:center; border-radius:26px; padding:34px 26px calc(28px + env(safe-area-inset-bottom));
    color:#0b0b0f; background:linear-gradient(135deg,#22d3f5,#ff2fb0 85%); box-shadow:0 24px 70px rgba(0,0,0,.5);
    animation:lo-pop .45s cubic-bezier(.2,1.2,.35,1); }
  @keyframes lo-pop{ 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  .listo-emoji{ font-size:66px; line-height:1; animation:lo-shake .8s ease infinite; }
  @keyframes lo-shake{ 0%,100%{transform:rotate(0)} 20%{transform:rotate(-16deg)} 40%{transform:rotate(14deg)} 60%{transform:rotate(-10deg)} 80%{transform:rotate(8deg)} }
  .listo-t{ font-size:44px; font-weight:900; letter-spacing:1px; margin:6px 0 4px; }
  .listo-sub{ font-size:17px; font-weight:700; line-height:1.35; }
  .listo-sub b{ background:rgba(255,255,255,.35); padding:1px 8px; border-radius:8px; }
  .listo-btn{ margin-top:20px; border:0; background:#0b0b0f; color:#fff; font-weight:800; font-size:16px;
    padding:13px 30px; border-radius:999px; cursor:pointer; }
  .listo-btn:active{ transform:scale(.96); }
  .confirmacion{ padding:60px 24px; text-align:center; }
  .confirmacion h2{ font-size:20px; margin-bottom:10px; }
  .confirmacion p{ color:var(--gray); font-size:13.5px; line-height:1.5; margin-bottom:22px; }
  .confirmacion .cta{
    display:inline-flex; padding:12px 22px; border-radius:30px;
    background:linear-gradient(90deg,var(--cyan),var(--pink)); color:#04040a; font-weight:800; font-size:13px;
  }

  @media (min-width:640px){ body{ max-width:820px; } .resumen{ max-width:820px; } }

  /* Formulario de pedido ONLINE (recoger / domicilio) */
  .online-form{ padding:6px 16px 14px; display:flex; flex-direction:column; gap:10px; }
  .of-title{ font-size:13px; font-weight:800; margin-top:4px; }
  .tipo-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .tipo-op{ flex:1 1 46%; display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:12px;
    border:1.5px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); font-size:13px; font-weight:700; cursor:pointer; }
  .tipo-op input{ accent-color:var(--cyan); }
  .tipo-op:has(input:checked){ border-color:var(--cyan); background:rgba(34,211,245,.12); }
  .online-form input[type=text], .online-form input[type=tel]{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04); color:var(--white); font-size:13px; }
</style>
</head>
<body>

  <header>
    <a class="back-btn" id="backBtn" aria-label="Volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Tu pedido</h1>
  </header>

  <div id="contenido">
    <div class="empty-msg">Cargando…</div>
  </div>

  <script src="/carrito.js"></script>
  <script>
    function getTenantSlug() {
      const partes = location.pathname.split('/').filter(Boolean);
      // /<slug>/checkout
      if (partes[0]) return decodeURIComponent(partes[0]);
      return 'cero-absoluto';
    }
    const SLUG = getTenantSlug();
    document.getElementById('backBtn').href = `/${SLUG}/menu`;
    Carrito.captarMesa(SLUG);   // recuerda la mesa si vino del QR

    let TENANT = null;

    // ¿Es un pedido ONLINE? = negocio POS, SIN mesa, con recoger o domicilio activado.
    function _esOnline(){
      return TENANT && TENANT.modo === 'pos' && !Carrito.getMesa(SLUG) &&
        (TENANT.pos_online_recoger || TENANT.pos_online_domicilio);
    }
    function _formOnlineHTML(){
      const rec = !!TENANT.pos_online_recoger, dom = !!TENANT.pos_online_domicilio;
      const ops = [];
      if(rec) ops.push(`<label class="tipo-op"><input type="radio" name="tipoPedido" value="recoger" ${!dom?'checked':''}> 🌐 Para recoger</label>`);
      if(dom) ops.push(`<label class="tipo-op"><input type="radio" name="tipoPedido" value="domicilio" ${!rec?'checked':''}> 🛵 A domicilio</label>`);
      // dirección visible si arranca en domicilio (solo domicilio, o ninguno preseleccionado a recoger)
      const dirVisible = dom && !rec;
      return `<div class="online-form">
        <div class="of-title">¿Cómo quieres tu pedido?</div>
        <div class="tipo-row">${ops.join('')}</div>
        <input id="ofNombre" type="text" placeholder="Tu nombre *">
        <input id="ofTel" type="tel" placeholder="Tu teléfono / WhatsApp *">
        <input id="ofDir" type="text" placeholder="Dirección de entrega *" style="display:${dirVisible?'block':'none'}">
        <input id="notaInput" type="text" placeholder="Nota (opcional)">
      </div>`;
    }
    function _wireOnlineForm(){
      document.querySelectorAll('input[name=tipoPedido]').forEach(r=>{
        r.addEventListener('change', ()=>{
          const dir=document.getElementById('ofDir');
          if(dir) dir.style.display = (r.value==='domicilio' && r.checked) ? 'block' : (document.querySelector('input[name=tipoPedido]:checked')?.value==='domicilio'?'block':'none');
        });
      });
    }

    function pintarCarrito() {
      const items = Carrito.obtener(SLUG);
      const contenido = document.getElementById('contenido');

      if (items.length === 0) {
        contenido.innerHTML = `<div class="empty-msg">Tu carrito está vacío.<br><br><a href="/${SLUG}/menu" style="color:var(--cyan)">Ver el menú →</a></div>`;
        return;
      }

      const moneda = TENANT?.moneda || 'COP';
      let html = '<div class="lista">';
      items.forEach(it => {
        html += `
          <div class="item">
            <div class="item-info">
              <div class="item-nombre">${it.nombre}</div>
              <div class="item-precio">${formatearPrecio(it.precio, moneda)} c/u</div>
            </div>
            <div class="qty">
              <button data-accion="restar" data-id="${it.producto_id}">−</button>
              <span>${it.cantidad}</span>
              <button data-accion="sumar" data-id="${it.producto_id}">+</button>
            </div>
            <div class="item-sub">${formatearPrecio(it.precio * it.cantidad, moneda)}</div>
          </div>`;
      });
      html += '</div>';
      html += _esOnline() ? _formOnlineHTML() : `
        <div class="nota">
          <label for="notaInput">Nota para tu pedido</label>
          <input id="notaInput" type="text" placeholder="Ej: sin azúcar, poco hielo…">
        </div>`;
      contenido.innerHTML = html;
      if(_esOnline()) _wireOnlineForm();

      contenido.querySelectorAll('[data-accion]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const delta = btn.dataset.accion === 'sumar' ? 1 : -1;
          Carrito.cambiarCantidad(SLUG, id, delta);
          pintarCarrito();
          pintarResumen();
        });
      });
    }

    function pintarResumen() {
      const total = Carrito.totalPrecio(SLUG);
      const n = Carrito.totalItems(SLUG);
      const moneda = TENANT?.moneda || 'COP';
      let bar = document.getElementById('resumenBar');
      if (n === 0) { if (bar) bar.remove(); return; }
      if (!bar) {
        bar = document.createElement('div');
        bar.className = 'resumen';
        bar.id = 'resumenBar';
        document.body.appendChild(bar);
      }
      const labelBtn = (TENANT?.modo === 'pos') ? 'CONFIRMAR PEDIDO' : (TENANT?.whatsapp ? 'ENVIAR PEDIDO POR WHATSAPP' : 'CONFIRMAR PEDIDO');
      bar.innerHTML = `
        <div class="resumen-total"><span>Total (${n})</span><span>${formatearPrecio(total, moneda)}</span></div>
        <button class="btn-confirmar" id="btnConfirmar">${labelBtn}</button>`;
      document.getElementById('btnConfirmar').addEventListener('click', confirmarPedido);
    }

    function construirMensajeWhatsapp(items, total, nota, pedidoId, moneda) {
      let texto = `Hola *${TENANT.nombre}* 👋, quiero hacer este pedido (#${pedidoId}):\n\n`;
      items.forEach(it => {
        texto += `• ${it.cantidad}x ${it.nombre} — ${formatearPrecio(it.precio * it.cantidad, moneda)}\n`;
      });
      texto += `\n*Total: ${formatearPrecio(total, moneda)}*`;
      if (nota) texto += `\nNota: ${nota}`;
      return encodeURIComponent(texto);
    }

    async function confirmarPedido() {
      const items = Carrito.obtener(SLUG);
      if (items.length === 0) return;
      const btn = document.getElementById('btnConfirmar');
      btn.disabled = true;
      btn.textContent = 'ENVIANDO...';

      const nota = document.getElementById('notaInput')?.value || '';
      const total = Carrito.totalPrecio(SLUG);
      const moneda = TENANT?.moneda || 'COP';
      const _reset = ()=>{ btn.disabled=false; btn.textContent = (_esOnline()? 'CONFIRMAR PEDIDO' : (TENANT?.whatsapp && TENANT?.modo!=='pos' ? 'ENVIAR PEDIDO POR WHATSAPP' : 'CONFIRMAR PEDIDO')); };

      // Arma el cuerpo según el contexto: online (recoger/domicilio), mesa, o autónomo.
      let body, tipoOnline=null;
      if (_esOnline()) {
        tipoOnline = (document.querySelector('input[name=tipoPedido]:checked')||{}).value
                     || (TENANT.pos_online_recoger ? 'recoger' : 'domicilio');
        const cliente = (document.getElementById('ofNombre')?.value || '').trim();
        const telefono = (document.getElementById('ofTel')?.value || '').trim();
        const direccion = (document.getElementById('ofDir')?.value || '').trim();
        if (!cliente || !telefono) { alert('Escribe tu nombre y tu teléfono.'); _reset(); return; }
        if (tipoOnline === 'domicilio' && !direccion) { alert('Escribe la dirección de entrega.'); _reset(); return; }
        body = { items, total, tipo: tipoOnline, cliente, telefono, direccion, cliente_nota: nota };
      } else {
        body = { items, total, cliente_nota: nota, mesa: Carrito.getMesa(SLUG) };
      }

      try {
        const esPos = TENANT?.modo === 'pos';
        const r = await fetch(`/menu/${SLUG}/pedido`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'No se pudo registrar el pedido');

        // POS (mesa u online): ya entró a la cocina, no abrimos WhatsApp.
        // Autónomo con WhatsApp: abrimos el chat con el detalle.
        if (TENANT.whatsapp && !esPos) {
          const mensaje = construirMensajeWhatsapp(items, total, nota, data.id, moneda);
          window.open(`https://wa.me/${TENANT.whatsapp}?text=${mensaje}`, '_blank');
        }

        Carrito.vaciar(SLUG);
        mostrarConfirmacion(data.id, total, { online: !!tipoOnline, tipo: tipoOnline, numero: data.numero });
      } catch (err) {
        _reset();
        const m = String(err.message||'');
        if (m.includes('mesa')) alert('Escanea el código QR de tu mesa para hacer el pedido.');
        else if (m.includes('online_') ) alert('Este negocio no tiene ese tipo de pedido online activado.');
        else if (m.includes('direccion')) alert('Escribe la dirección de entrega.');
        else alert('No se pudo enviar el pedido. Intenta de nuevo.');
        console.warn(err);
      }
    }

    function mostrarConfirmacion(pedidoId, total, extra) {
      document.getElementById('resumenBar')?.remove();
      const moneda = TENANT?.moneda || 'COP';

      // Pedido ONLINE (recoger / domicilio): ya entró al POS en "Fuera".
      if (extra && extra.online) {
        const esDom = extra.tipo === 'domicilio';
        document.getElementById('contenido').innerHTML = `
          <div class="confirmacion">
            <h2>¡Pedido recibido! ${esDom ? '🛵' : '🌐'}</h2>
            <p>
              N.º de pedido <strong>#${extra.numero || pedidoId}</strong> · Total: <strong>${formatearPrecio(total, moneda)}</strong>
            </p>
            <div id="pedidoTrack" class="ped-track">
              <div class="ped-track-dot"></div>
              <div class="ped-track-txt" id="pedidoTrackTxt">${esDom ? 'Preparando tu pedido…' : 'Preparando tu pedido…'}</div>
            </div>
            <p class="ped-track-hint">Deja esta pantalla abierta y te avisamos aquí mismo con una alerta cuando esté listo. 🔔</p>
            <a class="cta" href="/${SLUG}">VOLVER AL MENÚ</a>
          </div>`;
        iniciarSeguimiento(pedidoId, esDom);
        return;
      }

      // Modo POS en la mesa: el pedido ya está en la cocina, en la mesa del cliente.
      if (TENANT?.modo === 'pos') {
        const mesa = Carrito.getMesa(SLUG);
        document.getElementById('contenido').innerHTML = `
          <div class="confirmacion">
            <h2>¡Pedido enviado a la cocina! 👨‍🍳</h2>
            <p>
              ${mesa ? ('Mesa <strong>' + mesa + '</strong> · ') : ''}Total: <strong>${formatearPrecio(total, moneda)}</strong><br><br>
              Tu pedido ya entró a la cocina. El mesero te lo llevará a la mesa. ¡Buen provecho!
            </p>
            <a class="cta" href="/${SLUG}">VOLVER AL MENÚ</a>
          </div>`;
        return;
      }

      const tienePago = !!TENANT?.pago_url;
      const tieneWhatsapp = !!TENANT?.whatsapp;

      document.getElementById('contenido').innerHTML = `
        <div class="confirmacion">
          <h2>¡Pedido #${pedidoId} registrado!</h2>
          <p>
            Total: <strong>${formatearPrecio(total, moneda)}</strong><br><br>
            ${tieneWhatsapp
              ? 'Te abrimos WhatsApp en una pestaña nueva con tu pedido ya escrito — solo dale enviar.'
              : (tienePago
                  ? 'Te abrimos la página de pago en una pestaña nueva. Cuando termines, muestra la confirmación en caja o a tu mesero.'
                  : 'Acércate a caja o avisa a tu mesero para completar el pago de tu pedido.')}
          </p>
          ${tienePago && !tieneWhatsapp ? `<a class="cta" href="${TENANT.pago_url}" target="_blank">IR A PAGAR</a>` : `<a class="cta" href="/${SLUG}">VOLVER AL INICIO</a>`}
        </div>`;

      if (tienePago && !tieneWhatsapp) {
        setTimeout(() => window.open(TENANT.pago_url, '_blank'), 400);
      }
    }

    // ── Seguimiento del pedido: consulta el estado y avisa cuando esté listo ──
    let _seguirTimer = null;
    function _beepListo(){
      try{
        const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
        const ctx=window._ac||(window._ac=new AC()); if(ctx.state==='suspended')ctx.resume().catch(()=>{});
        const b=(t,f)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
          g.gain.setValueAtTime(0.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.4,ctx.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.4);
          o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.42);};
        b(0,880);b(0.45,1175);b(0.9,880);
      }catch(e){}
    }
    function iniciarSeguimiento(clave, esDom){
      if(!clave) return;
      let avisado=false, fallos=0;
      const tick=async()=>{
        try{
          const r=await fetch(`/menu/${SLUG}/estado?pedido=${encodeURIComponent(clave)}`,{cache:'no-store'});
          if(!r.ok){ fallos++; if(fallos>8){clearInterval(_seguirTimer);} return; }
          fallos=0;
          const d=await r.json();
          const txt=document.getElementById('pedidoTrackTxt');
          if(d.estado==='preparando' && txt) txt.textContent='¡Manos a la obra! Preparando tu pedido…';
          if((d.listo||d.estado==='listo') && !avisado){
            avisado=true; clearInterval(_seguirTimer);
            mostrarAlertaListo(d.recogida||'la caja', esDom);
          } else if(d.entregado){ clearInterval(_seguirTimer); if(txt)txt.textContent='Pedido entregado. ¡Gracias! 🙌'; }
        }catch(e){ fallos++; if(fallos>8){clearInterval(_seguirTimer);} }
      };
      tick();
      _seguirTimer=setInterval(tick, 6000);   // revisa cada 6 segundos
    }
    function mostrarAlertaListo(recogida, esDom){
      _beepListo();
      try{ if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]); }catch(e){}
      const linea = esDom
        ? '¡Tu pedido está listo y ya sale para tu dirección! 🛵'
        : ('¡Tu pedido está listo! Recógelo en <b>'+recogida+'</b> 🎉');
      let host=document.getElementById('alertaListoHost');
      if(!host){ host=document.createElement('div'); host.id='alertaListoHost'; document.body.appendChild(host); }
      host.innerHTML=`
        <div class="listo-ov" onclick="this.remove()">
          <div class="listo-card" onclick="event.stopPropagation()">
            <div class="listo-emoji">🔔</div>
            <div class="listo-t">¡LISTO!</div>
            <div class="listo-sub">${linea}</div>
            <button class="listo-btn" onclick="document.getElementById('alertaListoHost').remove()">¡Voy!</button>
          </div>
        </div>`;
      // Re-vibra un par de veces más por si no estaban mirando
      let veces=0; const rev=setInterval(()=>{ if(veces++>=3||!document.getElementById('alertaListoHost')){clearInterval(rev);return;} try{if(navigator.vibrate)navigator.vibrate([250,120,250]);}catch(e){} _beepListo(); }, 3000);
    }

    fetch(`/menu/${SLUG}`)
      .then(r => r.ok ? r.json() : Promise.reject(new Error('Negocio no encontrado')))
      .then(data => {
        TENANT = data;
        document.title = `Tu pedido — ${data.nombre}`;
        const root = document.documentElement.style;
        if (data.tema.fondo) root.setProperty('--bg', data.tema.fondo);
        if (data.tema.acento2) root.setProperty('--cyan', data.tema.acento2);
        if (data.tema.acento1) root.setProperty('--pink', data.tema.acento1);
        pintarCarrito();
        pintarResumen();
      })
      .catch(err => {
        document.getElementById('contenido').innerHTML = '<div class="empty-msg">No se pudo cargar el negocio.</div>';
        console.warn(err);
      });
  </script>
</body>
