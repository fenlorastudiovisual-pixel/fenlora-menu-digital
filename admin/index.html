<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenlora — Admin</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --panel2:#191d23; --line:#232830; --text:#eef1f4; --muted:#8b93a1;
    --accent:#5eead4; --accent-dim:#1c3b36; --danger:#f2555a; --danger-dim:#3a1c1e; --warn:#f5b942; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{padding:20px 32px 0;border-bottom:1px solid var(--line);}
  .header-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;}
  header h1{font-size:19px;margin:0;letter-spacing:.3px;}
  header .tag{color:var(--muted);font-size:12.5px;}
  .tabs{display:flex;gap:22px;}
  .tab-btn{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:10px 2px 12px;cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--accent);border-color:var(--accent);}
  main{max-width:1100px;margin:0 auto;padding:28px 32px 60px;}
  .tab-panel{display:none;} .tab-panel.active{display:block;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .stat-card .num{font-size:26px;font-weight:800;}
  .stat-card .label{color:var(--muted);font-size:12px;margin-top:4px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .panel h2{margin:0 0 14px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .empty{color:var(--muted);font-size:13.5px;padding:4px 0;}

  form{display:grid;gap:12px;}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;}
  input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#0f1215;color:var(--text);font-size:13.5px;}
  input:focus,select:focus{outline:2px solid var(--accent-dim);border-color:var(--accent);}
  button{background:var(--accent);color:#04201b;border:none;padding:9px 16px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13px;}
  button:hover{opacity:.9;} button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  button.danger{background:var(--danger-dim);color:#ffb3b6;} button.small{padding:6px 11px;font-size:12px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .msg{font-size:12.5px;margin-top:2px;min-height:15px;} .msg.ok{color:var(--accent);} .msg.err{color:var(--danger);}

  .toolbar{display:flex;gap:10px;margin-bottom:18px;}
  .toolbar input{flex:1;}

  .grid-negocios{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .neg-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s;}
  .neg-card:hover{border-color:var(--accent);}
  .neg-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .neg-card .nombre{font-weight:700;font-size:14.5px;}
  .neg-card .nicho{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;}
  .pill.on{background:var(--accent-dim);color:var(--accent);}
  .pill.off{background:var(--danger-dim);color:#ff9ea1;}
  .pill.warn{background:#3a2f10;color:var(--warn);}
  .neg-card .metrics{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);}
  .neg-card .metrics b{color:var(--text);}

  .detalle-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .detalle-header h2{margin:0;font-size:18px;}
  .detalle-acciones{display:flex;gap:8px;flex-wrap:wrap;}
  .detalle-acciones a{color:var(--accent);text-decoration:none;font-size:12.5px;align-self:center;}

  .subtabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .subtab{background:none;border:none;color:var(--muted);padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;}
  .subtab.active{color:var(--accent);border-color:var(--accent);}
  .subpanel{display:none;} .subpanel.active{display:block;}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px;}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .prod-thumb{width:34px;height:34px;border-radius:6px;background:#0f1215;object-fit:cover;}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div>
      <h1>Fenlora · Panel de negocios</h1>
      <span class="tag">Menú digital multitenant</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="resumen">Resumen</button>
    <button class="tab-btn" data-tab="negocios">Negocios</button>
  </div>
</header>

<main>

  <!-- ===================== RESUMEN ===================== -->
  <section id="tab-resumen" class="tab-panel active">
    <div class="stats" id="stats-grid"><p class="empty">Cargando…</p></div>
    <div class="panel">
      <h2>Negocios activos sin productos cargados</h2>
      <div id="sin-productos-wrap"><p class="empty">Cargando…</p></div>
    </div>
  </section>

  <!-- ===================== NEGOCIOS ===================== -->
  <section id="tab-negocios" class="tab-panel">
    <div class="toolbar">
      <input id="buscador" placeholder="Buscar negocio por nombre o nicho…">
      <button id="btnNuevoNegocio">+ Negocio</button>
    </div>

    <div id="panel-crear" class="panel" style="display:none;">
      <h2>Crear nuevo negocio</h2>
      <form id="form-nuevo">
        <div class="row">
          <div><label for="nombre">Nombre del negocio</label><input id="nombre" required placeholder="Ej: Cero Absoluto"></div>
          <div><label for="whatsapp">WhatsApp (código de país, sin +)</label><input id="whatsapp" placeholder="Ej: 573001234567"></div>
        </div>
        <div><label for="nicho">Nicho / plantilla base</label><select id="nicho" required></select></div>
        <div class="row">
          <div><label for="pago_url">Link de pago (Wompi, Bold, etc. — opcional)</label><input id="pago_url" placeholder="https://checkout.wompi.co/l/xxxxx"></div>
          <div><label for="moneda">Moneda</label>
            <select id="moneda">
              <option value="COP">COP — Peso colombiano</option>
              <option value="PEN">PEN — Sol peruano</option>
              <option value="MXN">MXN — Peso mexicano</option>
              <option value="USD">USD — Dólar</option>
            </select>
          </div>
        </div>
        <div><button type="submit">Crear negocio</button> <div class="msg" id="msg"></div></div>
      </form>
    </div>

    <div id="grid-negocios" class="grid-negocios"><p class="empty">Cargando…</p></div>

    <!-- ============ DETALLE DE UN NEGOCIO ============ -->
    <div id="panel-detalle" class="panel" style="display:none;">
      <div class="detalle-header">
        <h2 id="detalle-nombre">—</h2>
        <div class="detalle-acciones">
          <a id="detalle-ver-sitio" target="_blank">Ver sitio ↗</a>
          <button class="secondary small" id="detalle-whatsapp">Enviar link por WhatsApp</button>
          <button class="secondary small" id="detalle-suspender">Suspender</button>
          <button class="danger small" id="detalle-eliminar">Eliminar</button>
        </div>
      </div>

      <div class="subtabs">
        <button class="subtab active" data-sub="datos">Datos</button>
        <button class="subtab" data-sub="productos">Productos</button>
        <button class="subtab" data-sub="pedidos">Pedidos</button>
      </div>

      <div id="sub-datos" class="subpanel active">
        <form id="form-datos">
          <div class="row">
            <div><label>Nombre</label><input id="d-nombre"></div>
            <div><label>WhatsApp</label><input id="d-whatsapp"></div>
          </div>
          <div class="row">
            <div><label>Link de pago</label><input id="d-pago-url"></div>
            <div><label>Moneda</label>
              <select id="d-moneda">
                <option value="COP">COP</option><option value="PEN">PEN</option>
                <option value="MXN">MXN</option><option value="USD">USD</option>
              </select>
            </div>
          </div>
          <div><button type="submit">Guardar cambios</button> <div class="msg" id="d-msg"></div></div>
        </form>
      </div>

      <div id="sub-productos" class="subpanel">
        <form id="form-producto" style="margin-bottom:18px;">
          <div class="row">
            <div><label>Categoría</label><input id="p-categoria" required placeholder="Ej: Granizados"></div>
            <div><label>Nombre</label><input id="p-nombre" required placeholder="Ej: Granizado Tropical"></div>
          </div>
          <div class="row">
            <div><label>Precio</label><input id="p-precio" type="number" step="0.01" required></div>
            <div><label>Foto (opcional)</label><input id="p-foto" type="file" accept="image/*"></div>
          </div>
          <div><label>Descripción (opcional)</label><input id="p-descripcion"></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="p-destacado" style="width:auto;"> <label for="p-destacado" style="margin:0;">Mostrar en "Nuestros Favoritos" del home</label>
          </div>
          <div><button type="submit">Agregar producto</button> <div class="msg" id="p-msg"></div></div>
        </form>
        <div id="productos-wrap"><p class="empty">Elige un negocio primero.</p></div>
      </div>

      <div id="sub-pedidos" class="subpanel">
        <div id="pedidos-wrap"><p class="empty">Elige un negocio primero.</p></div>
      </div>
    </div>
  </section>

</main>

<script>
const $ = s => document.querySelector(s);
let TENANTS = [];
let ACTIVO_ID = null;

// ---------------- TABS PRINCIPALES ----------------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('#tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'resumen') cargarResumen();
  });
});

// ---------------- RESUMEN ----------------
async function cargarResumen() {
  const r = await fetch('/admin/api/resumen');
  const d = await r.json();
  $('#stats-grid').innerHTML = `
    <div class="stat-card"><div class="num">${d.negocios_activos}/${d.negocios_total}</div><div class="label">Negocios activos</div></div>
    <div class="stat-card"><div class="num">${d.productos_total}</div><div class="label">Productos cargados</div></div>
    <div class="stat-card"><div class="num">${d.pedidos_total}</div><div class="label">Pedidos totales</div></div>
    <div class="stat-card"><div class="num">${d.pedidos_pendientes}</div><div class="label">Pedidos pendientes de pago</div></div>`;

  const wrap = $('#sin-productos-wrap');
  if (!d.negocios_sin_productos.length) { wrap.innerHTML = '<p class="empty">Todos los negocios activos ya tienen productos.</p>'; return; }
  wrap.innerHTML = d.negocios_sin_productos.map(n => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);">
      <span>${n.nombre}</span>
      <button class="secondary small" onclick="irANegocio('${n.id}')">Cargar productos →</button>
    </div>`).join('');
}

function irANegocio(id) {
  document.querySelector('[data-tab="negocios"]').click();
  setTimeout(() => seleccionarNegocio(id), 50);
}

// ---------------- NICHOS ----------------
async function cargarNichos() {
  const r = await fetch('/admin/api/nichos');
  const { nichos } = await r.json();
  $('#nicho').innerHTML = nichos.map(n => `<option value="${n.id}">${n.label}</option>`).join('');
}

// ---------------- LISTA DE NEGOCIOS ----------------
async function cargarTenants() {
  const r = await fetch('/admin/api/tenants');
  const { tenants } = await r.json();
  TENANTS = tenants;
  pintarGrid();
}

function pintarGrid() {
  const filtro = ($('#buscador').value || '').toLowerCase();
  const lista = TENANTS.filter(t => t.nombre.toLowerCase().includes(filtro) || t.nicho.toLowerCase().includes(filtro));
  const grid = $('#grid-negocios');
  if (!lista.length) { grid.innerHTML = '<p class="empty">No hay negocios que coincidan.</p>'; return; }
  grid.innerHTML = lista.map(t => `
    <div class="neg-card" onclick="seleccionarNegocio('${t.id}')">
      <div class="top">
        <div>
          <div class="nombre">${t.nombre}</div>
          <div class="nicho">${t.nicho}</div>
        </div>
        <span class="pill ${t.activo ? 'on' : 'off'}">${t.activo ? 'Activo' : 'Suspendido'}</span>
      </div>
      <div class="metrics">
        <span><b>${t.total_productos}</b> productos</span>
        <span><b>${t.total_pedidos}</b> pedidos</span>
        ${t.pedidos_pendientes > 0 ? `<span class="pill warn">${t.pedidos_pendientes} pendientes</span>` : ''}
      </div>
    </div>`).join('');
}

$('#buscador').addEventListener('input', pintarGrid);

$('#btnNuevoNegocio').addEventListener('click', () => {
  const p = $('#panel-crear');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
});

$('#form-nuevo').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#msg'); msg.textContent = ''; msg.className = 'msg';
  const payload = {
    nombre: $('#nombre').value.trim(),
    whatsapp: $('#whatsapp').value.trim(),
    nicho: $('#nicho').value,
    pago_url: $('#pago_url').value.trim() || null,
    moneda: $('#moneda').value
  };
  const r = await fetch('/admin/api/tenants', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  });
  const data = await r.json();
  if (!r.ok) { msg.textContent = data.error || 'Error al crear'; msg.className = 'msg err'; return; }
  msg.textContent = `Creado — ${location.origin}/${data.id}`; msg.className = 'msg ok';
  e.target.reset();
  cargarTenants();
});

// ---------------- DETALLE DE UN NEGOCIO ----------------
document.querySelectorAll('.subtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.subtab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.subpanel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('#sub-' + btn.dataset.sub).classList.add('active');
  });
});

async function seleccionarNegocio(id) {
  ACTIVO_ID = id;
  const r = await fetch(`/admin/api/tenants/${encodeURIComponent(id)}`);
  const t = await r.json();

  $('#panel-detalle').style.display = 'block';
  $('#detalle-nombre').textContent = t.nombre;
  $('#detalle-ver-sitio').href = `/${t.id}`;
  $('#detalle-suspender').textContent = t.activo ? 'Suspender' : 'Reactivar';

  $('#d-nombre').value = t.nombre;
  $('#d-whatsapp').value = t.whatsapp || '';
  $('#d-pago-url').value = t.pago_url || '';
  $('#d-moneda').value = t.moneda || 'COP';

  $('#panel-detalle').scrollIntoView({ behavior: 'smooth', block: 'start' });
  cargarProductos(id);
  cargarPedidos(id);
}

$('#detalle-ver-sitio').addEventListener('click', (e) => { if (!ACTIVO_ID) e.preventDefault(); });

$('#detalle-whatsapp').addEventListener('click', () => {
  if (!ACTIVO_ID) return;
  const t = TENANTS.find(x => x.id === ACTIVO_ID);
  if (!t || !t.whatsapp) { alert('Este negocio no tiene WhatsApp cargado.'); return; }
  const link = `${location.origin}/${ACTIVO_ID}`;
  const mensaje = encodeURIComponent(`Hola ${t.nombre}! Aquí tienes el link de tu menú digital: ${link}`);
  window.open(`https://wa.me/${t.whatsapp}?text=${mensaje}`, '_blank');
});

$('#detalle-suspender').addEventListener('click', async () => {
  if (!ACTIVO_ID) return;
  const t = TENANTS.find(x => x.id === ACTIVO_ID);
  const nuevoEstado = t.activo ? 0 : 1;
  await fetch(`/admin/api/tenants/${encodeURIComponent(ACTIVO_ID)}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ activo: nuevoEstado })
  });
  await cargarTenants();
  seleccionarNegocio(ACTIVO_ID);
});

$('#detalle-eliminar').addEventListener('click', async () => {
  if (!ACTIVO_ID) return;
  if (!confirm('¿Eliminar este negocio y todos sus productos/pedidos? Esta acción no se puede deshacer.')) return;
  await fetch(`/admin/api/tenants/${encodeURIComponent(ACTIVO_ID)}`, { method: 'DELETE' });
  $('#panel-detalle').style.display = 'none';
  ACTIVO_ID = null;
  cargarTenants();
});

$('#form-datos').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!ACTIVO_ID) return;
  const msg = $('#d-msg'); msg.textContent = ''; msg.className = 'msg';
  const r = await fetch(`/admin/api/tenants/${encodeURIComponent(ACTIVO_ID)}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nombre: $('#d-nombre').value.trim(),
      whatsapp: $('#d-whatsapp').value.trim(),
      pago_url: $('#d-pago-url').value.trim() || null,
      moneda: $('#d-moneda').value
    })
  });
  const data = await r.json();
  if (!r.ok) { msg.textContent = data.error || 'Error al guardar'; msg.className = 'msg err'; return; }
  msg.textContent = 'Guardado ✓'; msg.className = 'msg ok';
  cargarTenants();
});

// ---------------- PRODUCTOS ----------------
async function cargarProductos(tenantId) {
  const wrap = $('#productos-wrap');
  wrap.innerHTML = '<p class="empty">Cargando…</p>';
  const r = await fetch(`/admin/api/tenants/${encodeURIComponent(tenantId)}/products`);
  const { productos } = await r.json();
  if (!productos.length) { wrap.innerHTML = '<p class="empty">Este negocio todavía no tiene productos.</p>'; return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th></th><th>Categoría</th><th>Nombre</th><th>Precio</th><th>Destacado</th><th></th></tr></thead>
      <tbody>
        ${productos.map(p => `
          <tr>
            <td>${p.imagen_url ? `<img class="prod-thumb" src="${p.imagen_url}">` : ''}</td>
            <td>${p.categoria}</td>
            <td>${p.nombre}</td>
            <td>${Number(p.precio).toFixed(2)}</td>
            <td>${p.destacado ? '★' : ''}</td>
            <td><button class="danger small" onclick="borrarProducto(${p.id})">Eliminar</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

$('#form-producto').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!ACTIVO_ID) return;
  const msg = $('#p-msg'); msg.textContent = ''; msg.className = 'msg';

  let imagen_url = null;
  const file = $('#p-foto').files[0];
  if (file) {
    const fd = new FormData();
    fd.append('file', file); fd.append('tenant_id', ACTIVO_ID); fd.append('carpeta', 'producto');
    const ru = await fetch('/admin/api/upload', { method: 'POST', body: fd });
    const du = await ru.json();
    if (!ru.ok) { msg.textContent = du.error || 'Error al subir la foto'; msg.className = 'msg err'; return; }
    imagen_url = du.url;
  }

  const r = await fetch(`/admin/api/tenants/${encodeURIComponent(ACTIVO_ID)}/products`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      categoria: $('#p-categoria').value.trim(),
      nombre: $('#p-nombre').value.trim(),
      descripcion: $('#p-descripcion').value.trim(),
      precio: Number($('#p-precio').value),
      imagen_url, destacado: $('#p-destacado').checked
    })
  });
  const data = await r.json();
  if (!r.ok) { msg.textContent = data.error || 'Error al guardar'; msg.className = 'msg err'; return; }
  msg.textContent = 'Producto agregado ✓'; msg.className = 'msg ok';
  e.target.reset();
  cargarProductos(ACTIVO_ID);
  cargarTenants();
});

async function borrarProducto(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  await fetch(`/admin/api/products/${id}`, { method: 'DELETE' });
  cargarProductos(ACTIVO_ID);
  cargarTenants();
}

// ---------------- PEDIDOS ----------------
const ESTADOS_PEDIDO = ['pendiente_pago', 'pagado', 'cancelado'];

async function cargarPedidos(tenantId) {
  const wrap = $('#pedidos-wrap');
  wrap.innerHTML = '<p class="empty">Cargando…</p>';
  const r = await fetch(`/admin/api/tenants/${encodeURIComponent(tenantId)}/pedidos`);
  const { pedidos } = await r.json();
  if (!pedidos.length) { wrap.innerHTML = '<p class="empty">Este negocio todavía no tiene pedidos.</p>'; return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Items</th><th>Total</th><th>Nota</th><th>Fecha</th><th>Estado</th></tr></thead>
      <tbody>
        ${pedidos.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${p.items.map(i => `${i.cantidad}× ${i.nombre}`).join('<br>')}</td>
            <td>${Number(p.total).toFixed(2)}</td>
            <td>${p.cliente_nota || '—'}</td>
            <td>${p.creado_en}</td>
            <td>
              <select onchange="actualizarEstadoPedido(${p.id}, this.value)">
                ${ESTADOS_PEDIDO.map(e => `<option value="${e}" ${e === p.estado ? 'selected' : ''}>${e}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function actualizarEstadoPedido(id, estado) {
  await fetch(`/admin/api/pedidos/${id}`, {
