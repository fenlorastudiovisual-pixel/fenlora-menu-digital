name = "fenlora-menu-digital"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "fenlora-menus"
database_id = "f86f89ac-f1ba-4d1b-82c6-b8a99cf315b0"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fenlora-menus-digitales"

# ── Seguridad del panel: verificación del token de Cloudflare Access dentro del Worker ──
# OBLIGATORIO: ACCESS_TEAM_DOMAIN = tu dominio de equipo. Lo LEES en la barra de direcciones
#   cuando te aparece la pantalla de login (dice algo como "fenlora.cloudflareaccess.com").
# OPCIONAL (más estricto): ACCESS_AUD = el "Application Audience (AUD) Tag" de la app de Access.
#   Puedes dejarlo como está (REEMPLAZAR...) y se ignora; o ponerlo luego para máxima estrictez.
# Mientras el dominio de equipo tenga "REEMPLAZAR", la API del panel responde 503 (cerrada, nunca abierta).
[vars]
ACCESS_TEAM_DOMAIN = "white-grass-9523.cloudflareaccess.com"
ACCESS_AUD = "92e58f5f1abc0e1a5c5545da7d9aa5c8fdcaf46cb41869a9cdc04de26d7f1415"
